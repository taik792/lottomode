name: Lotto V8 Backtest Automatizzato2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Ti permette di avviare il test manualmente con un clic

jobs:
  run-backtest:
    runs-on: ubuntu-latest

    steps:
    - name: Cambia codice sorgente
      uses: actions/checkout@v4

    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    
